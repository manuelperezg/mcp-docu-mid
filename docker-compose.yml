version: '3.8'

services:
  mcp-doc-mid:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-doc-mid:latest
    container_name: mcp-doc-mid-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - TRANSPORT_MODE=${TRANSPORT_MODE:-sse}
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_API_KEY=${MCP_API_KEY:-default-mcp-secret-key}
      - ENABLE_AUTH=${ENABLE_AUTH:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-1000}
      - STATS_STORAGE_ENABLED=${STATS_STORAGE_ENABLED:-true}
      - STATS_STORAGE_PATH=data/stats.json
      - SWAGGERS_DIR=swaggers
    volumes:
      # Montar volumen de swaggers para permitir actualizar APIs sin reconstruir imagen
      - ./swaggers:/app/swaggers:ro
      # Persistencia de métricas y estadísticas
      - mcp-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mcp-data:
    driver: local
